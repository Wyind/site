<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2147" />
      <stop offset="50%" stop-color="#051430" />
      <stop offset="100%" stop-color="#020817" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ff5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#4db8e8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#123b70" stop-opacity="0.5" />
    </linearGradient>

    <!-- W Main Gradient -->
    <linearGradient id="wGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ff5ff" />
      <stop offset="50%" stop-color="#4db8e8" />
      <stop offset="100%" stop-color="#1c5396" />
    </linearGradient>

    <!-- Accent Wave Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d8f3ff" />
      <stop offset="100%" stop-color="#8ff5ff" />
    </linearGradient>

    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ff5ff" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8ff5ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="8" />
  
  <!-- Subtle Backlight -->
  <circle cx="256" cy="256" r="180" fill="url(#centerGlow)" />

  <!-- Logo Mark: Stylized W Monogram + Ocean Wave Crests -->
  <g>
    <!-- Primary W ribbon -->
    <path d="M 124 168 
             C 124 168, 168 328, 188 348 
             C 202 362, 222 352, 234 326 
             L 256 274 
             L 278 326 
             C 290 352, 310 362, 324 348 
             C 344 328, 388 168, 388 168 
             C 388 168, 356 264, 342 284 
             C 334 295, 322 295, 314 280 
             L 274 200 
             C 266 184, 246 184, 238 200 
             L 198 280 
             C 190 295, 178 295, 170 284 
             C 156 264, 124 168, 124 168 Z" 
          fill="url(#wGrad)" />

    <!-- Wave Swoosh accent crossing top right -->
    <path d="M 230 180 
             C 280 145, 360 150, 410 185 
             C 416 189, 410 196, 402 194 
             C 358 180, 288 182, 238 210 
             C 232 213, 226 202, 230 180 Z" 
          fill="url(#accentGrad)" opacity="0.9" />
  </g>
</svg>
